# Serves the built Angular app and forwards /api to the .NET container, so the browser only ever talks to one
# origin. That is what lets the refresh-token cookie stay SameSite=Strict, and it means no CORS setup is needed.

# Docker's embedded DNS. The API address is looked up per request, so nginx starts (and keeps working)
# even while the API container is still starting or restarting.
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind a TLS-terminating proxy (a platform load balancer, Caddy, Cloudflare) the original scheme arrives in
# X-Forwarded-Proto. Pass it on; fall back to what nginx itself saw.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # ---- API ----
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 512k;

        # Responses carry personal data and tokens: never let a shared cache keep them.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- static files ----
    # Built file names contain a content hash, so they can be cached for a year.
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must always be re-checked, or a new release would not be picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Anything else is a client-side route (/board, /applications/123...): serve the app and let Angular route it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
