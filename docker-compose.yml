# Run the whole app:   cp .env.example .env   (set JWT_SIGNING_KEY)   then   docker compose up --build
# Open http://localhost:8080

name: applytrail

services:
  api:
    build:
      context: .
      dockerfile: src/ApplyTrail.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Required. Signs login tokens. Generate one: openssl rand -base64 48
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env, see .env.example}
      # false is right for http://localhost. Set true as soon as the site is served over https.
      Auth__CookieSecure: ${AUTH_COOKIE_SECURE:-false}
      Auth__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
    volumes:
      - applytrail-data:/data
    healthcheck:
      # The .NET runtime image has no curl, so speak HTTP over bash's built-in /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  applytrail-data:
